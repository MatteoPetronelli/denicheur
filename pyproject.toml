[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denicheur"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx", "pydantic>=2", "SQLAlchemy>=2", "alembic", "psycopg[binary]>=3",
  "anthropic", "PyYAML", "python-dotenv", "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude", "test_france_travail.py", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
