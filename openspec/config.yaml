schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Authoritative roadmap: docs/plans/2026-11-16-denicheur-roadmap.md (changes C0-C7, lots, contracts, test expectations). Do not redesign.
  User-facing text (Telegram, drafts, dashboard) in French; code and identifiers in English.
  Never send an application automatically; never scrape protected pages or bypass CAPTCHAs.
  No PII (phone, birth date, address) in git, LLM prompts or logs; .env, CV_base/, profile/cv_*.md stay local.
  Tests run offline: fixtures + httpx.MockTransport + fake LLM; time injected, never datetime.now() in logic.

rules:
  tasks:
    - One "## Lot n" heading per lot from the roadmap; numbered checkboxes; quality gate box last
    - Each lot starts with the skills it names and its blocking first step

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
